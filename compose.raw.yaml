services:
  raw-app:
    image: dadtrack-raw:latest
    build:
      context: .
    env_file:
      - ${RAW_ENV_FILE:-.env.raw}
    environment:
      APP_DATA_MODE: raw
      RAW_DATA_DIR: /data/raw
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAW_APP_PORT:-3010}:3000"
    volumes:
      - raw_data:/data/raw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  raw_data:
